name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  labs:
    runs-on: ubuntu-latest
    # A real Postgres with the pgvector extension, so the vector store is tested for real.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kd
          POSTGRES_PASSWORD: kd
          POSTGRES_DB: kd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kd -d kd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KD_COURSE_DATABASE_URL: postgresql+psycopg://kd:kd@127.0.0.1:5432/kd_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # CPU build of PyTorch: the package tests use a tiny model and need no GPU.
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install "transformers>=4.56" accelerate datasets peft pillow "sqlalchemy>=2.0" "psycopg[binary]>=3.2" "pgvector>=0.3"
      - run: uv run --no-sync pytest -q tests/kd_course tests/labs -rs
      - name: Fail if any lab test was skipped
        run: "! uv run --no-sync pytest -q tests/kd_course tests/labs -rs | grep -q SKIPPED"

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, site]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: make install
      - run: cd site && npx playwright install --with-deps chromium
      - run: make e2e
