name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # CPU build of PyTorch: the package tests use a tiny model and need no GPU.
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install "transformers>=4.56" accelerate datasets peft
      - run: uv run --no-sync pytest -q tests/kd_course tests/labs -rs
      - name: Fail if any lab test was skipped
        run: "! uv run --no-sync pytest -q tests/kd_course tests/labs -rs | grep -q SKIPPED"

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, site]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: make install
      - run: cd site && npx playwright install --with-deps chromium
      - run: make e2e
